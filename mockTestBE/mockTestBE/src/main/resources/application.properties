spring.application.name=mockTestBE

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mockTestDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server port (optional) as 8080 is the defaut one
server.port=8080


# Front End Cors 
spring.web.cors.allowed-origin-patterns=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*


#jwt key
jwt.secret=ReplaceWithAVeryLongSecretKeyAtLeast32CharsLong!!